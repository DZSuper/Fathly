backend:
  name: github
  repo: DZSuper/Fathly
  branch: main
  base_url: https://sveltia-cms-auth.danisuryaanugrah12345.workers.dev

media_folder: "assets/img"
public_folder: "/assets/img"

# Catatan: opsi 'locale' di bawah ini sudah tidak berefek di Sveltia CMS —
# bahasa UI terdeteksi otomatis dari browser. Aman dibiarkan atau dihapus.
locale: 'id'

collections:

  # ── HALAMAN UTAMA ──────────────────────────────────────────
  - name: "halaman-utama"
    label: "🏠 Halaman Utama"
    files:
      - name: "beranda"
        label: "Beranda (Mata Pelajaran & Kartu)"
        file: "config/site.json"
        fields:
          - name: "judul_website"
            label: "Judul Website"
            widget: "string"
          - name: "mapel"
            label: "Mata Pelajaran"
            widget: "list"
            summary: "{{fields.judul}}"
            fields:
              - name: "judul"
                label: "Judul Mata Pelajaran"
                widget: "string"
              - name: "kartu"
                label: "Kartu-kartu"
                widget: "list"
                summary: "{{fields.nama}}"
                fields:
                  - name: "nama"
                    label: "Nama Kartu"
                    widget: "string"
                  - name: "link"
                    label: "Link Halaman"
                    widget: "string"

  # ── MATERI ──────────────────────────────────────────────────
  - name: "materi"
    label: "📚 Materi"
    files:

      - name: "tauhid"
        label: "Tauhid"
        file: "content/materi/data/tauhid.json"
        fields:
          - name: "judul"
            label: "Judul Halaman"
            widget: "string"
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - name: "id"
                label: "ID (huruf kecil, tanpa spasi)"
                widget: "string"
              - name: "nama"
                label: "Nama Kelompok"
                widget: "string"
              - name: "konten"
                label: "Konten"
                widget: "text"

      - name: "bidah"
        label: "Bid'ah"
        file: "content/materi/data/bidah.json"
        fields:
          - name: "judul"
            label: "Judul Halaman"
            widget: "string"
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - name: "id"
                label: "ID (huruf kecil, tanpa spasi)"
                widget: "string"
              - name: "nama"
                label: "Nama Kelompok"
                widget: "string"
              - name: "konten"
                label: "Konten"
                widget: "text"

      - name: "sifat"
        label: "Sifat Allah"
        file: "content/materi/data/sifat.json"
        fields:
          - name: "judul"
            label: "Judul Halaman"
            widget: "string"
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - name: "id"
                label: "ID (huruf kecil, tanpa spasi)"
                widget: "string"
              - name: "nama"
                label: "Nama Kelompok"
                widget: "string"
              - name: "konten"
                label: "Konten"
                widget: "text"

      - name: "iman"
        label: "Iman"
        file: "content/materi/data/iman.json"
        fields:
          - name: "judul"
            label: "Judul Halaman"
            widget: "string"
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - name: "id"
                label: "ID (huruf kecil, tanpa spasi)"
                widget: "string"
              - name: "nama"
                label: "Nama Kelompok"
                widget: "string"
              - name: "konten"
                label: "Konten"
                widget: "text"

      - name: "abu-syuja"
        label: "Matan Abu Syuja'"
        file: "content/materi/data/abu-syuja.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

      - name: "umdatul-ahkam"
        label: "Umdatul Ahkam"
        file: "content/materi/data/umdatul-ahkam.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

      - name: "jurumiyah"
        label: "Matan Jurumiyah"
        file: "content/materi/data/jurumiyah.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

      - name: "mutammimah"
        label: "Mutammimah"
        file: "content/materi/data/mutammimah.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

      - name: "tashrif"
        label: "Kaedah-kaedah Tashrif"
        file: "content/materi/data/tashrif.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

      - name: "wazan"
        label: "Wazan-wazan Shorf"
        file: "content/materi/data/wazan.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

      - name: "siroh-nabawi"
        label: "Siroh Nabawi"
        file: "content/materi/data/siroh-nabawi.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

      - name: "siroh-sahabat"
        label: "Siroh Sahabat"
        file: "content/materi/data/siroh-sahabat.json"
        fields:
          - {name: "judul", label: "Judul Halaman", widget: "string"}
          - name: "kelompok"
            label: "Kelompok"
            widget: "list"
            summary: "{{fields.nama}}"
            fields:
              - {name: "id", label: "ID", widget: "string"}
              - {name: "nama", label: "Nama Kelompok", widget: "string"}
              - {name: "konten", label: "Konten", widget: "text"}

  # ── MATAN (Al-Ajurumiyyah, Qawa'idul Arba, Al-Arba'in) ───────
  # Struktur tiap file: babList (daftar bab + sub-bab) dan baits (isi per bait).
  # PENTING: urutan item di "Daftar Bait" HARUS mengikuti urutan bab di
  # "Daftar Bab" (semua bait bab pertama dulu, baru bab kedua, dst) — sistem
  # paginasi & sidebar di halaman matan bergantung pada urutan ini.
  - name: "matan-mgr"
    label: "📗 Matan"
    files:

      - name: "jurumiyah"
        label: "Al-Ajurumiyyah"
        file: "content/matan/data/jurumiyah.json"
        fields:
          - name: "babList"
            label: "Daftar Bab"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "babId harus unik dan dipakai persis sama di kolom 'ID Bab' pada Daftar Bait di bawah."
            fields:
              - {name: "babId", label: "ID Bab (huruf kecil, tanda hubung)", widget: "string", hint: "Contoh: bab-muqaddimah"}
              - {name: "title", label: "Judul Bab (Arab)", widget: "string"}
              - name: "subBab"
                label: "Sub-Bab (kosongkan jika bab ini tidak punya sub-bab)"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - {name: "subBabId", label: "ID Sub-Bab", widget: "string", hint: "Contoh: alamat_rafa. Harus dipakai persis sama di kolom 'ID Sub-Bab' pada bait terkait."}
                  - {name: "title", label: "Judul Sub-Bab (Arab)", widget: "string"}
          - name: "baits"
            label: "Daftar Bait"
            widget: "list"
            summary: "{{fields.id}} — {{fields.arab}}"
            hint: "Urutan di sini = urutan tampil, HARUS berurutan mengikuti Daftar Bab di atas."
            fields:
              - {name: "id", label: "Nomor Urut (angka, mulai dari 0)", widget: "number", value_type: "int"}
              - name: "babId"
                label: "ID Bab"
                widget: "relation"
                collection: "matan-mgr"
                file: "jurumiyah"
                value_field: "babList.*.babId"
                search_fields: ["babList.*.title", "babList.*.babId"]
                display_fields: ["babList.*.babId"]
                hint: "Pilih dari Daftar Bab di atas."
              - {name: "subBabId", label: "ID Sub-Bab (kosongkan jika bab ini tidak punya sub-bab)", widget: "string", required: false, hint: "Harus sama persis dengan ID Sub-Bab yang didaftarkan di bab terkait."}
              - {name: "arab", label: "Teks Arab (berharakat)", widget: "text"}
              - {name: "keterangan", label: "Keterangan", widget: "text", hint: "Boleh pakai HTML sederhana: <strong>, <em>, <span class=\"arab-ref\">istilah</span>"}

      - name: "qawaidul-arba"
        label: "Al-Qawa'idul Arba'"
        file: "content/matan/data/qawaidul-arba.json"
        fields:
          - name: "babList"
            label: "Daftar Bab"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "babId harus unik dan dipakai persis sama di kolom 'ID Bab' pada Daftar Bait di bawah."
            fields:
              - {name: "babId", label: "ID Bab (huruf kecil, tanda hubung)", widget: "string"}
              - {name: "title", label: "Judul Bab (Arab)", widget: "string"}
              - name: "subBab"
                label: "Sub-Bab (kosongkan jika bab ini tidak punya sub-bab)"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - {name: "subBabId", label: "ID Sub-Bab", widget: "string"}
                  - {name: "title", label: "Judul Sub-Bab (Arab)", widget: "string"}
          - name: "baits"
            label: "Daftar Bait"
            widget: "list"
            summary: "{{fields.id}} — {{fields.arab}}"
            hint: "Urutan di sini = urutan tampil, HARUS berurutan mengikuti Daftar Bab di atas."
            fields:
              - {name: "id", label: "Nomor Urut (angka, mulai dari 0)", widget: "number", value_type: "int"}
              - name: "babId"
                label: "ID Bab"
                widget: "relation"
                collection: "matan-mgr"
                file: "qawaidul-arba"
                value_field: "babList.*.babId"
                search_fields: ["babList.*.title", "babList.*.babId"]
                display_fields: ["babList.*.babId"]
                hint: "Pilih dari Daftar Bab di atas."
              - {name: "subBabId", label: "ID Sub-Bab (kosongkan jika bab ini tidak punya sub-bab)", widget: "string", required: false}
              - {name: "arab", label: "Teks Arab (berharakat)", widget: "text"}
              - {name: "keterangan", label: "Keterangan", widget: "text", hint: "Boleh pakai HTML sederhana: <strong>, <em>, <span class=\"arab-ref\">istilah</span>"}

      - name: "arbain"
        label: "Al-Arba'in An-Nawawiyyah"
        file: "content/matan/data/arbain.json"
        fields:
          - name: "babList"
            label: "Daftar Bab"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "babId harus unik dan dipakai persis sama di kolom 'ID Bab' pada Daftar Bait di bawah."
            fields:
              - {name: "babId", label: "ID Bab (huruf kecil, tanda hubung)", widget: "string"}
              - {name: "title", label: "Judul Bab (Arab)", widget: "string"}
              - name: "subBab"
                label: "Sub-Bab (kosongkan jika bab ini tidak punya sub-bab)"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - {name: "subBabId", label: "ID Sub-Bab", widget: "string"}
                  - {name: "title", label: "Judul Sub-Bab (Arab)", widget: "string"}
          - name: "baits"
            label: "Daftar Bait (Hadits)"
            widget: "list"
            summary: "{{fields.id}} — {{fields.arab}}"
            hint: "Urutan di sini = urutan tampil, HARUS berurutan mengikuti Daftar Bab di atas."
            fields:
              - {name: "id", label: "Nomor Urut (angka, mulai dari 0)", widget: "number", value_type: "int"}
              - name: "babId"
                label: "ID Bab"
                widget: "relation"
                collection: "matan-mgr"
                file: "arbain"
                value_field: "babList.*.babId"
                search_fields: ["babList.*.title", "babList.*.babId"]
                display_fields: ["babList.*.babId"]
                hint: "Pilih dari Daftar Bab di atas."
              - {name: "subBabId", label: "ID Sub-Bab (kosongkan jika bab ini tidak punya sub-bab)", widget: "string", required: false}
              - {name: "arab", label: "Teks Arab (berharakat)", widget: "text"}
              - {name: "keterangan", label: "Keterangan", widget: "text", hint: "Boleh pakai HTML sederhana: <strong>, <em>, <span class=\"arab-ref\">istilah</span>"}

  # ── DALIL ───────────────────────────────────────────────────
  - name: "dalil-mgr"
    label: "📖 Dalil"
    files:
      - name: "dalil"
        label: "Dalil & Tema"
        file: "content/dalil/data/dalil.json"
        fields:

          - name: "temaList"
            label: "🏷️ Daftar Tema"
            widget: "list"
            summary: "{{fields.nama}}"
            hint: "Tambah/ubah tema di sini otomatis muncul sebagai pilihan filter Tema di halaman Dalil."
            fields:
              - {name: "temaId", label: "ID Tema (huruf kecil, tanda hubung)", widget: "string", hint: "Contoh: sholat-berjamaah. Jangan diubah setelah dipakai oleh dalil manapun."}
              - {name: "nama", label: "Nama Tampil", widget: "string", hint: "Contoh: Sholat Berjamaah"}
              - name: "kategori"
                label: "Kategori"
                widget: "select"
                options: ["fiqih", "aqidah", "muamalah", "akhlak"]

          - name: "dalilList"
            label: "📜 Daftar Dalil"
            widget: "list"
            summary: "{{fields.rujukan}}"
            fields:
              - {name: "id", label: "ID (huruf kecil, contoh: d09)", widget: "string", hint: "Harus unik — dipakai di URL halaman detail."}
              - name: "sumber"
                label: "Sumber"
                widget: "select"
                options:
                  - {label: "Al-Qur'an", value: "quran"}
                  - {label: "Hadits", value: "hadits"}
              - name: "grade"
                label: "Derajat"
                widget: "select"
                options:
                  - {label: "Shahih", value: "shahih"}
                  - {label: "Hasan", value: "hasan"}
                  - {label: "Dhaif", value: "dhaif"}
                hint: "Untuk ayat Al-Qur'an, selalu pilih Shahih (Al-Qur'an mutawatir) — badge derajat hanya tampil di kartu kalau Sumber = Hadits, jadi aman."
              - {name: "rujukan", label: "Rujukan", widget: "string", hint: "Contoh: QS. Al-Baqarah: 43 / HR. Bukhari & Muslim, dari Ibnu Umar"}
              - {name: "kitab", label: "Nama Kitab Hadits (kosongkan untuk Al-Qur'an)", widget: "string", required: false, hint: "Contoh: Bukhari, Muslim, Ibnu Majah"}
              - {name: "arab", label: "Teks Arab (berharakat)", widget: "text"}
              - {name: "terjemahan", label: "Terjemahan", widget: "text"}
              - name: "tema"
                label: "Tema"
                widget: "relation"
                collection: "dalil-mgr"
                file: "dalil"
                value_field: "temaList.*.temaId"
                search_fields: ["temaList.*.nama", "temaList.*.temaId"]
                display_fields: ["temaList.*.nama"]
                multiple: true
                hint: "Boleh pilih lebih dari satu tema. Tambah tema baru dulu di Daftar Tema di atas kalau belum ada, lalu simpan."

              - name: "tafsirBanding"
                label: "📊 Perbandingan Tafsir/Syarah Ulama"
                widget: "list"
                required: false
                summary: "{{fields.ulama}} — {{fields.kitab}}"
                hint: "Kosongkan kalau belum ada data pembanding untuk dalil ini."
                fields:
                  - {name: "ulama", label: "Nama Ulama", widget: "string"}
                  - {name: "kitab", label: "Nama Kitab", widget: "string"}
                  - {name: "isi", label: "Penjelasan", widget: "text"}

              - name: "qiroah"
                label: "🔤 Perbedaan Qira'at"
                widget: "list"
                required: false
                summary: "{{fields.imam}}"
                hint: "Khusus ayat Al-Qur'an. Kosongkan kalau tidak ada perbedaan qira'at yang perlu ditampilkan."
                fields:
                  - {name: "imam", label: "Nama Imam/Riwayat", widget: "string", hint: "Contoh: Hafsh 'an 'Ashim"}
                  - {name: "riwayat", label: "Keterangan Riwayat", widget: "string", hint: "Contoh: Riwayat yang umum dipakai di mushaf cetakan Indonesia"}
                  - {name: "bacaan", label: "Teks Bacaan (Arab)", widget: "text"}
                  - {name: "keterangan", label: "Penjelasan Perbedaan", widget: "text"}

              - name: "faedah"
                label: "💡 Faedah"
                widget: "list"
                required: false
                hint: "Poin-poin pelajaran dari dalil ini, satu poin per baris."

              - name: "takhrij"
                label: "🔗 Takhrij / Sumber Riwayat"
                widget: "list"
                required: false
                summary: "{{fields.kitab}} no. {{fields.no}}"
                fields:
                  - {name: "kitab", label: "Nama Kitab Hadits", widget: "string", hint: "Contoh: Shahih Bukhari"}
                  - {name: "no", label: "Nomor Hadits", widget: "string"}
                  - {name: "status", label: "Status", widget: "string", default: "ada", hint: "Saat ini selalu \"ada\" — dibiarkan sebagai field untuk pengembangan ke depan."}

  - name: "coming-soon"
    label: "Coming Soon"
    files:
      - name: "coming-soon"
        label: "Halaman Coming Soon"
        file: "content/coming-soon/coming-soon.json"
        fields:
          - {name: "judul", label: "Judul", widget: "string"}
          - {name: "deskripsi", label: "Deskripsi", widget: "text"}
          - name: "berita"
            label: "Daftar Berita"
            widget: "list"
            summary: "{{fields.judul}}"
            fields:
              - {name: "id", label: "ID (huruf kecil, tanpa spasi)", widget: "string"}
              - {name: "judul", label: "Judul Berita", widget: "string"}
              - {name: "deskripsi", label: "Deskripsi", widget: "text"}
              - name: "status"
                label: "Status"
                widget: "select"
                options: ["voting", "aktif", "selesai"]
              - name: "items"
                label: "Item-item"
                widget: "list"
                required: false
                summary: "{{fields.nama}}"
                fields:
                  - {name: "id", label: "ID", widget: "string"}
                  - {name: "nama", label: "Nama", widget: "string"}
                  - {name: "subjudul", label: "Subjudul", widget: "string"}
                  - {name: "deskripsi", label: "Deskripsi", widget: "text"}
                  - {name: "link", label: "Link", widget: "string"}

  - name: "seo"
    label: "SEO"
    files:
      - name: "seo"
        label: "Deskripsi & Kata Kunci"
        file: "config/seo.json"
        fields:
          - name: "description"
            label: "Deskripsi Website"
            widget: "text"
            hint: "Teks singkat yang muncul di hasil pencarian Google (ideal 150-160 karakter)"
          - name: "keywords"
            label: "Kata Kunci Pencarian"
            widget: "string"
            hint: "Pisahkan dengan koma. Contoh: ilmu agama islam, manhaj salaf, tauhid"

  # ── DOA & DZIKIR ────────────────────────────────────────────
  - name: "doa-mgr"
    label: "🤲 Doa & Dzikir"
    files:
      - name: "dzikir-pagi"
        label: "🌅 Dzikir Pagi"
        file: "content/doa/data/dzikir-pagi.json"
        fields:
          - {name: "kategori", label: "Nama Kategori", widget: "string"}
          - {name: "waktu", label: "Keterangan Waktu", widget: "string", required: false}
          - name: "doa"
            label: "Daftar Doa/Dzikir"
            widget: "list"
            summary: "{{fields.judul}}"
            fields:
              - {name: "id", label: "ID (unik, contoh: dp01)", widget: "string"}
              - {name: "judul", label: "Judul", widget: "string"}
              - {name: "arab", label: "Teks Arab (berharakat)", widget: "text", hint: "Tulis dari kanan ke kiri, lengkap dengan harakat"}
              - {name: "latin", label: "Tulisan Latin", widget: "text"}
              - {name: "terjemahan", label: "Terjemahan", widget: "text"}
              - {name: "sumber", label: "Sumber", widget: "string", required: false, hint: "Contoh: HR. Muslim, no. 2723 / QS. Al-Baqarah: 255"}
              - {name: "jumlah", label: "Jumlah Bacaan", widget: "string", required: false, hint: "Contoh: 1x, 3x, 33x. Kosongkan jika tidak ada hitungan ulang."}
              - {name: "keterangan", label: "Keterangan/Faedah", widget: "text", required: false}

